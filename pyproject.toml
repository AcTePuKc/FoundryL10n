[project]
name = "foundryl10n"
version = "0.1.0"
description = "Professional local-first localization workstation for games and software. Powered by local LLMs (Ollama) with technical tag protection, persistent project-aware memory, and a specialized review interface."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.25.1",
    "keyring>=25.7.0",
    "ollama>=0.6.1",
    "pydantic>=2.12.5",
    "pyinstaller>=6.17.0",
    "pyside6>=6.10.1",
    "rich>=14.2.0",
    "sqlmodel>=0.0.31",
    "typer>=0.21.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
