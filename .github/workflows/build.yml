name: Build FoundryL10n

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Build Executable
        run: |
          uv run pyinstaller --onefile --collect-all sqlmodel --collect-all pydantic --collect-all ollama --collect-all sqlalchemy --add-data "src;src" --add-data "profiles;profiles" --add-data "resources;resources" --paths "src" --hidden-import "pysqlite3" --icon "resources/app.ico" --name "FoundryL10n" src/main.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/FoundryL10n.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}